version: '3'

info:
  companyName: "rexchoppers"
  productName: "Trellis"
  productIdentifier: "com.wails.trellis"
  description: "Welcome to the 47th floor"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .claude
      - node_modules
      - frontend
      - build
      - assets
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
