name: Build

on:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          go mod download
          pnpm --dir frontend install --frozen-lockfile

      - name: Set version from tag
        run: |
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" build/darwin/Info.plist
          plutil -replace CFBundleVersion -string "${GITHUB_REF_NAME#v}" build/darwin/Info.plist

      - name: Build
        run: |
          wails3 task darwin:build ARCH=arm64 OUTPUT=build/bin/trellis-arm64
          wails3 task darwin:build ARCH=amd64 OUTPUT=build/bin/trellis-amd64
          wails3 tool lipo -input build/bin/trellis-arm64 -input build/bin/trellis-amd64 -output build/bin/trellis
          wails3 task darwin:create:app:bundle

      - name: Vet
        run: go vet ./...

      - name: Package
        run: |
          mkdir dist
          mv build/bin/trellis.app build/bin/Trellis.app
          ditto -c -k --keepParent build/bin/Trellis.app "dist/Trellis-macos-$GITHUB_REF_NAME.zip"
          cat > dist/README.txt <<'TXT'
          Trellis beta build (unsigned).

          1. Unzip and move Trellis.app into Applications.
          2. First time only: right-click Trellis.app and choose Open (it's unsigned).
             If macOS still refuses, run: xattr -cr /Applications/Trellis.app
          3. After that, open it like any app.

          Needs Claude Code (run claude once to log in), git and gh installed.
          TXT

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Trellis $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag
